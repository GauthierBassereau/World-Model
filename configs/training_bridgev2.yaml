logging:
  project: world_model_bridgev2
  entity: null
  run_name: 400M_bridgev2_proprio_patch_no_t_cond
  output_dir: checkpoints
  log_interval: 1
  signal_level_log_limit: 100
  checkpoint_interval: 1000

trainer:
  loss_type: velocity
  loss_weighting: null
  loss_weighting_intercept: 0.1
  loss_weighting_slope: 0.9
  evaluation_interval: 500
  grad_accum_steps: 4
  precision: bf16
  seed: 3
  resume: false # true
  load_checkpoint: null

evaluator:
  video_sample_indices: all
  rollout_start_frame: 10
  rollout_horizons: [1, 5, 10, 20, 40]
  rollout_signal_level: 0.8
  rollout_add_noise: true
  teacher_forced_batch_size: 64
  precision: bf16
  max_batches: 10

optimizer:
  lr:
    "0": 1.0e-7
    "500": 3.0e-4
    "30000": 3.0e-4
    "60000": 3.0e-5
  eps: 1.0e-08
  grad_clip_norm: 1.0
  weight_decay: 0.0

ema:
  enabled: false
  decay: 0.9995
  start_step: 5000

train_dataloader:
  batch_size: 120
  shuffle: true
  num_workers: 6
  pin_memory: true

train_dataset:
  sequence_length_distribution:
    "40": 1.0
  fps: 5.0
  action_dim: 13
  weights:
    bridgev2: 1.0
  reference_dataset: bridgev2
  datasets:
    bridgev2:
      type: lerobot
      repo_id: Gaugou/BridgeV2
      episodes: null
      excluded_episodes: [862, 992, 4294, 8547, 9870, 9936, 12566, 15199, 15357, 15595, 16997, 24245, 25554, 26026, 30751, 30819, 31067, 31218, 34287, 35453, 35666, 36020, 36096, 38066, 38839, 39578, 39688, 41007, 41606, 41881, 46999, 48578]
      episode_startpoint_only: true
      cameras:
        observation.images.primary: 1.0
      action_mode: bridgev2_proprio_action_normalized
      independent_frames_probability: 0.15
      use_action_probability: 0.8

eval_dataloader:
  batch_size: 18
  shuffle: false
  num_workers: 0
  pin_memory: false

eval_dataset:
  sequence_length_distribution:
    "60": 1.0
  fps: 5.0
  action_dim: 13
  weights:
    bridgev2_eval: 1.0
  reference_dataset: bridgev2_eval
  datasets:
    bridgev2_eval:
      type: lerobot
      repo_id: Gaugou/BridgeV2
      episodes: [862, 992, 4294, 8547, 9870, 9936, 12566, 15199, 15357, 15595, 16997, 24245, 25554, 26026, 30751, 30819, 31067, 31218, 34287, 35453, 35666, 36020, 36096, 38066, 38839, 39578, 39688, 41007, 41606, 41881, 46999, 48578]
      excluded_episodes: null
      episode_startpoint_only: true
      cameras:
        observation.images.primary: 1.0
      action_mode: bridgev2_proprio_action_normalized
      independent_frames_probability: 0.0
      use_action_probability: 1.0

patch_forcing:
  enabled: true
  sampler: ltg
  ltg_std: 0.6
  difficulty_loss_weight: 0.01

signal_scheduler:
  mode: "logit_normal"  # {"resolution_shift", "linear_shift", "uniform", "logit_normal"}
  min_value: 0.0
  max_value: 1.0
  logit_normal_loc: 0.0
  logit_normal_scale: 1.0

euler_solver:
  number_steps: 50
  min_denom: 0.05
  timestep_schedule: "linear"

world_model:
  input_dim: 768
  latent_dim: 1024 # 1536, 1024
  bottleneck_dim: null
  action_dim: 13
  num_registers: 4
  depth: 24 # 28, 24
  num_heads: 16 # 24, 16
  mlp_multiplier: 4 # 2.666667, 4
  temporal_attention_interval: 4
  temporal_context_length: 24
  rope_base: 10000.0
  qk_norm_eps: 1.0e-06
  attn_logit_softcapping: 50.0 # None for no softcapping -> able to use fused_attention
  use_action_token: true  # false for pretraining (no actions), true for finetuning
  use_signal_token: false
  signal_embedding_type: fourier # fourier, learned
  signal_embedding_num_bins: 1024
  patch_signal_conditioning: false
  patch_signal_embed_dim: 256
  predict_patch_difficulty: true
