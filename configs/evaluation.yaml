logging:
  project: world_model_evaluation_bridgev2
  entity: null
  run_name: baseline_5euler
  output_dir: "/checkpoints"
  log_interval: 1
  signal_level_log_limit: 100
  checkpoint_interval: 0

checkpoint_path: checkpoints/400M_bridgev2_proprio_fixedrope/world_model_step_060000.pt

# This checked-in checkpoint predates the RAEv2 refactor. New checkpoints save
# their autoencoder config; switch this block to type: raev2 when evaluating one.
autoencoder:
  type: legacy

evaluator:
  video_sample_indices: all
  rollout_start_frame: 10
  rollout_horizons: [1, 5, 10, 20, 30, 40, 50]
  rollout_signal_level: 0.8
  rollout_add_noise: true
  teacher_forced_batch_size: 64
  precision: bf16
  max_batches: 10

eval_dataset:
  sequence_length_distribution:
    "85": 1.0
  fps: 5.0
  action_dim: 13
  weights:
    bridgev2_eval: 1.0
  reference_dataset: bridgev2_eval
  datasets:
    bridgev2_eval:
      type: lerobot
      repo_id: Gaugou/BridgeV2
      episodes: [862, 992, 4294, 8547, 9870, 9936, 12566, 15199, 15357, 15595, 16997, 24245, 25554, 26026, 30751, 30819, 31067, 31218, 34287, 35453, 35666, 36020, 36096, 38066, 38839, 39578, 39688, 41007, 41606, 41881, 46999, 48578]
      excluded_episodes: null
      episode_startpoint_only: true
      cameras:
        observation.images.primary: 1.0
      action_mode: bridgev2_proprio_action_normalized
      independent_frames_probability: 0.0
      use_action_probability: 1.0

eval_dataloader:
  batch_size: 8
  shuffle: false
  num_workers: 0
  pin_memory: true

signal_scheduler:
  mode: "logit_normal"  # {"resolution_shift", "linear_shift", "uniform", "logit_normal"}
  min_value: 0.0
  max_value: 1.0
  logit_normal_loc: 0.0
  logit_normal_scale: 1.0


euler_solver:
  number_steps: 5
  min_denom: 0.05
  timestep_schedule: "linear" # linear, signal
  sampler: "euler" # "euler" or "adaptive"
  adaptive_percentile: 0.4
  adaptive_inner_steps: 10

world_model:
  input_dim: 768
  latent_dim: 1024 # 1536, 1024
  bottleneck_dim: null
  action_dim: 13
  num_registers: 4
  depth: 24 # 28, 24
  num_heads: 16 # 24, 16
  mlp_multiplier: 4 # 2.666667, 4
  temporal_attention_interval: 4
  temporal_context_length: 24
  rope_base: 10000.0
  qk_norm_eps: 1.0e-06
  attn_logit_softcapping: 50.0 # None for no softcapping -> able to use fused_attention
  use_signal_token: true
  signal_embedding_type: fourier # fourier, learned
  signal_embedding_num_bins: 1024
  predict_patch_difficulty: false
