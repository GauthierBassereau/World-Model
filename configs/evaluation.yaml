logging:
  project: world_model_evaluation
  entity: null
  run_name: presentation_eval
  output_dir: "/checkpoints"
  log_interval: 1
  signal_level_log_limit: 100
  checkpoint_interval: 0

checkpoint_path: /gpfs/helios/home/gauthierbernarda/git/World-Model/checkpoints/400M_res_local_b128_t4_10%ur5/world_model_step_031000.pt

evaluator:
  video_sample_indices: all
  rollout_start_frame: 10
  rollout_horizons: [1, 5, 10, 20, 30, 40, 50]
  rollout_signal_level: 0.8
  rollout_add_noise: true
  teacher_forced_batch_size: 64
  precision: bf16
  max_batches: 10

eval_dataset:
  sequence_length_distribution:
    "85": 1.0
  fps: 5.0
  action_dim: 7
  weights:
    ur5_fix_eval: 1.0
  reference_dataset: ur5_fix_eval
  datasets:
    ur5_fix_eval:
      type: lerobot
      repo_id: Gaugou/ur5_fix_5hz_eval
      episodes: null
      excluded_episodes: null
      episode_startpoint_only: true
      cameras:
        observation.images.front: 1.0
      action_mode: ur5_relative_local_ee_normalized
      independent_frames_probability: 0.0
      use_action_probability: 1.0

eval_dataloader:
  batch_size: 8
  shuffle: false
  num_workers: 0
  pin_memory: true

signal_scheduler:
  mode: "resolution_shift"  # {"resolution_shift", "linear_shift", "uniform", "logit_normal"}
  min_value: 0.0
  max_value: 1.0
  logit_normal_loc: -0.8
  logit_normal_scale: 0.8

euler_solver:
  number_steps: 50
  min_denom: 0.05
  timestep_schedule: "signal" # linear, signal

world_model:
  input_dim: 768
  latent_dim: 1024 # 1536, 1024
  bottleneck_dim: null
  action_dim: 7
  num_registers: 4
  depth: 24 # 28, 24
  num_heads: 16 # 24, 16
  mlp_multiplier: 4 # 2.666667, 4
  temporal_attention_interval: 4
  temporal_context_length: 24
  rope_base: 10000.0
  qk_norm_eps: 1.0e-06
  attn_logit_softcapping: 50.0 # None for no softcapping -> able to use fused_attention
  use_action_token: true  # false for pretraining (no actions), true for finetuning
  use_signal_token: true
  signal_embedding_type: fourier
  signal_embedding_num_bins: 1024
  patch_signal_conditioning: false
  patch_signal_embed_dim: 256
