logging:
  project: world_model
  entity: null
  run_name: 400M_uniform_local_b128_t4_25%ur5_resume
  output_dir: checkpoints
  log_interval: 1
  signal_level_log_limit: 100
  checkpoint_interval: 1000

trainer:
  loss_type: velocity
  loss_weighting: null
  loss_weighting_intercept: 0.1
  loss_weighting_slope: 0.9
  evaluation_interval: 500
  grad_accum_steps: 4
  precision: bf16
  seed: 10
  resume: true # true
  load_checkpoint: checkpoints/400M_uniform_local_b128_t4_25%ur5/world_model_step_001000.pt

evaluator:
  video_sample_indices: all
  rollout_start_frame: 10
  rollout_horizons: [1, 5, 10, 20]
  rollout_signal_level: 0.8
  rollout_add_noise: true
  teacher_forced_batch_size: 64
  precision: bf16
  max_batches: 10

optimizer:
  lr:
    "0": 1.0e-7
    "500": 3.0e-4
  eps: 1.0e-08
  grad_clip_norm: 1.0
  weight_decay: 0.0

ema:
  enabled: false
  decay: 0.9995
  start_step: 5000

train_dataloader:
  batch_size: 128
  shuffle: true
  num_workers: 6
  pin_memory: true

train_dataset:
  sequence_length_distribution:
    "32": 1.0
  fps: 5.0
  action_dim: 7
  weights:
    ur5_fix: 0.05
    ur5_wild: 0.2
    bridgev2: 0.15
    epic_kitchens: 0.3
    droid: 0.3
  reference_dataset: ur5_fix
  datasets:
    ur5_fix:
      type: lerobot
      repo_id: Gaugou/ur5_fix_5hz
      episodes: null
      excluded_episodes: null
      episode_startpoint_only: false
      cameras:
        observation.images.front: 1.0
      action_mode: ur5_relative_local_ee_normalized
      independent_frames_probability: 0.3
      use_action_probability: 0.7
    ur5_wild:
      type: lerobot
      repo_id: Gaugou/ur5_wild_5hz
      episodes: null
      excluded_episodes: null
      episode_startpoint_only: false
      cameras:
        observation.images.front: 1.0
      action_mode: ur5_relative_local_ee_normalized
      independent_frames_probability: 0.3
      use_action_probability: 0.7
    bridgev2:
      type: lerobot
      repo_id: Gaugou/BridgeV2
      episodes: null
      excluded_episodes: null
      episode_startpoint_only: false
      cameras:
        observation.images.primary: 0.5
        observation.images.side1: 0.25
        observation.images.side2: 0.25
      action_mode: null
      independent_frames_probability: 0.3
      use_action_probability: 0.0
    epic_kitchens:
      type: lerobot
      repo_id: Gaugou/epic_kitchens_100
      episodes: null
      excluded_episodes: null
      episode_startpoint_only: false
      cameras:
        observation.images.ego: 1.0
      action_mode: null
      independent_frames_probability: 0.3
      use_action_probability: 0.0
    droid:
      type: lerobot
      repo_id: aractingi/droid_1.0.1
      episodes: null
      excluded_episodes: null
      episode_startpoint_only: false
      cameras:
        observation.images.exterior_1_left: 1.0
      action_mode: null
      independent_frames_probability: 0.3
      use_action_probability: 0.0

eval_dataloader:
  batch_size: 8
  shuffle: false
  num_workers: 0
  pin_memory: false

eval_dataset:
  sequence_length_distribution:
    "85": 1.0
  fps: 5.0
  action_dim: 7
  weights:
    ur5_fix_eval: 1.0
  reference_dataset: ur5_fix_eval
  datasets:
    ur5_fix_eval:
      type: lerobot
      repo_id: Gaugou/ur5_fix_5hz_eval
      episodes: null
      excluded_episodes: null
      episode_startpoint_only: true
      cameras:
        observation.images.front: 1.0
      action_mode: ur5_relative_local_ee_normalized
      independent_frames_probability: 0.0
      use_action_probability: 1.0

patch_forcing:
  enabled: false
  sampler: ltg
  ltg_std: 0.6

signal_scheduler:
  mode: "uniform"  # {"resolution_shift", "linear_shift", "uniform", "logit_normal"}
  min_value: 0.0
  max_value: 1.0
  logit_normal_loc: -0.8
  logit_normal_scale: 0.8

euler_solver:
  number_steps: 50
  min_denom: 0.05
  timestep_schedule: "signal"

world_model:
  input_dim: 768
  latent_dim: 1024 # 1536, 1024
  bottleneck_dim: null
  action_dim: 7
  num_registers: 4
  depth: 24 # 28, 24
  num_heads: 16 # 24, 16
  mlp_multiplier: 4 # 2.666667, 4
  temporal_attention_interval: 4
  temporal_context_length: 24
  rope_base: 10000.0
  qk_norm_eps: 1.0e-06
  attn_logit_softcapping: 50.0 # None for no softcapping -> able to use fused_attention
  use_action_token: true  # false for pretraining (no actions), true for finetuning
  use_signal_token: true
  signal_embedding_type: fourier
  signal_embedding_num_bins: 1024
  patch_signal_conditioning: false
  patch_signal_embed_dim: 256
